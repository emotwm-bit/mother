<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>媽媽的陪伴日記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: a home screen with four big time-of-day buttons; tapping one opens a short
   page for that part of the day (tick, photo, one sentence), ending in a picture card for LINE. */
:root{
  color-scheme:light;
  --bg:#FFF6EC; --ink:#2A2320; --muted:#6B5E57; --paper:#FFFFFF; --line:#EADBCB;
  --accent:#E0703F;
  --ok:#2E7A55; --ok-soft:#D3EEDD; --warn:#94600B; --warn-soft:#FFEBC2; --alert:#B2362C; --alert-soft:#FBD9D4;
  --shadow:rgba(120,70,40,.18);
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
.s-pagi {--t:#FFE6D3;--e:#F2B58C;--k:#A4531E}
.s-siang{--t:#FFF0C7;--e:#EDCF7A;--k:#8A6410}
.s-sore {--t:#DDF2E6;--e:#9FD3B5;--k:#2E7A55}
.s-malam{--t:#E6E1FA;--e:#BBAEEB;--k:#5140A0}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.2}
h2{font-size:26px;line-height:1.25}
h3{font-size:19px;line-height:1.3}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.i18n{display:inline-block;min-width:0;text-align:inherit}
.zh{display:block;font-family:var(--f-body);font-size:.74em;font-weight:500;line-height:1.35;opacity:.8}
.muted{color:var(--muted);font-size:15px}

/* header */
.hero{display:flex;gap:12px;align-items:center}
.hero-mark{flex:none;width:56px;height:56px;border-radius:50%;background:#FFE3CF;border:3px solid #F2B58C;display:grid;place-items:center;box-shadow:0 4px 0 #F2B58C;font-size:28px}
.bar{background:var(--paper);border-radius:18px;padding:6px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line)}
.bar button{border:0;background:transparent;min-width:46px;min-height:46px;border-radius:12px;font-size:24px;color:var(--accent);font-weight:700}
.bar button:disabled{opacity:.3;cursor:default}
.bar .day{flex:1;text-align:center;font-weight:900;font-size:18px}
.bar .today-btn{font-size:14px;padding:4px 12px;border:2px solid var(--accent);line-height:1.2}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who select{min-height:46px;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:0 12px;font-size:17px}
.banner{border-radius:14px;padding:10px 14px;background:var(--warn-soft);color:var(--warn);font-size:15px}

/* home: slot buttons */
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.slot{background:var(--t);border:3px solid var(--e);border-radius:24px;padding:16px 14px;min-height:150px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;
  box-shadow:0 6px 0 var(--e),0 14px 24px -14px var(--shadow);position:relative;transition:transform .08s}
.slot:active{transform:translateY(4px);box-shadow:0 2px 0 var(--e)}
.slot .emoji{font-size:34px;line-height:1}
.slot .nm{font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--k);line-height:1.15}
.slot .hrs{font-size:13px;color:var(--muted)}
.slot .prog{margin-top:auto;font-weight:900;font-size:16px;color:var(--k);background:var(--paper);border-radius:12px;padding:2px 10px}
.slot.now{outline:4px solid var(--k);outline-offset:3px}
.slot.now::after{content:"SEKARANG 現在";position:absolute;top:-12px;right:12px;background:var(--k);color:#fff;font-size:12px;font-weight:900;border-radius:10px;padding:2px 8px}
.slot.alldone .prog{background:var(--ok);color:#fff}

/* panels */
.card{background:var(--t,var(--paper));border:2px solid var(--e,var(--line));border-radius:22px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 5px 0 var(--e,var(--line))}
.item{background:var(--paper);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--line)}
.item.done{border-color:var(--ok);background:#F4FBF6}
.q{font-weight:900;font-size:18px;display:flex;gap:8px;align-items:flex-start}
.q .mark{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:16px;color:#fff;margin-top:1px}
.item.done .q .mark{background:var(--ok);border-color:var(--ok)}
.help{font-size:14px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:52px;padding:6px 16px;border-radius:14px;border:2px solid var(--e,var(--line));background:var(--paper);font-size:17px;font-weight:700;box-shadow:0 3px 0 var(--e,var(--line));line-height:1.3;text-align:center}
.seg button[aria-pressed="true"]{background:var(--k,var(--accent));border-color:var(--k,var(--accent));color:#fff}
.big{min-height:56px;border-radius:16px;border:0;background:var(--k,var(--accent));color:#fff;font-weight:900;font-size:18px;padding:7px 20px;line-height:1.3;width:100%;
  box-shadow:0 4px 0 color-mix(in srgb,var(--k,var(--accent)) 60%,#000)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--k,var(--accent)) 60%,#000)}
.ghost{min-height:50px;border-radius:14px;border:2px solid var(--k,var(--accent));background:var(--paper);color:var(--k,var(--accent));font-weight:700;padding:6px 14px;line-height:1.3}
.back{align-self:flex-start;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--paper);font-weight:700;padding:6px 14px;line-height:1.3}
input[type=text],input[type=time],input:not([type]),textarea,.num-in{width:100%;min-height:52px;border:2px solid var(--line);border-radius:14px;background:var(--bg);padding:8px 12px;font-size:18px}
textarea{min-height:84px;resize:vertical}
.bp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bp-grid label{font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:4px}
.reading{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:12px;background:var(--bg);flex-wrap:wrap}
.reading .n{font-size:20px;font-weight:900}
.flag{font-size:14px;font-weight:900;border-radius:12px;padding:2px 10px;text-align:center}
.flag.ok{background:var(--ok-soft);color:var(--ok)}.flag.warn{background:var(--warn-soft);color:var(--warn)}.flag.alert{background:var(--alert-soft);color:var(--alert)}
.x{border:0;background:transparent;color:var(--muted);min-width:40px;min-height:40px;border-radius:10px;font-size:20px}
.alertline{font-size:16px;color:var(--alert);font-weight:900;background:var(--alert-soft);border-radius:12px;padding:8px 12px}
.cups{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.cup{aspect-ratio:3/4;border-radius:8px 8px 14px 14px;border:2px solid #2D5F98;background:var(--paper);padding:0}
.cup.full{background:linear-gradient(to top,#5B9BE0 0 70%,var(--paper) 70%)}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:var(--bg)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;min-width:34px;min-height:34px}
.cam{display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;border-radius:16px;border:3px dashed var(--k,var(--accent));background:var(--paper);color:var(--k,var(--accent));font-weight:900;font-size:18px;cursor:pointer;line-height:1.3;padding:6px 12px;position:relative}
.cam input{position:absolute;opacity:0;width:1px;height:1px}
.notes{display:flex;flex-direction:column;gap:8px}
.note{background:var(--bg);border-radius:12px;padding:8px 12px}
.note .by{font-size:13px;color:var(--muted)}
details.fold{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:12px 16px;box-shadow:0 4px 0 var(--line)}
details.fold>summary{cursor:pointer;font-weight:900;font-size:17px;min-height:40px;display:flex;align-items:center;gap:8px}
details.fold[open]>summary{margin-bottom:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) 116px 40px;gap:6px;align-items:center}
.set-row input,.set-row select{min-height:46px;border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:4px 8px;width:100%;font-size:16px}
.dow{display:flex;gap:6px;flex-wrap:wrap}
.dow button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--paper);font-weight:700}
.dow button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.sos-strip{display:flex;align-items:center;gap:10px;background:var(--alert-soft);border:2px solid var(--alert);border-radius:18px;padding:10px 14px}
.sos-strip .t{flex:1;min-width:0;font-weight:900;color:var(--alert);font-size:15px}
.sos-strip .t b{display:block;color:var(--ink);font-size:18px}
.contact{padding:10px 0;border-top:2px dashed var(--line)}
.contact:first-child{border-top:0}
.badge{display:inline-block;font-size:13px;background:var(--alert);color:#fff;border-radius:12px;padding:1px 10px;margin-left:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:16px;font-weight:700;z-index:40;max-width:calc(100vw - 32px);text-align:center}
.modal{position:fixed;inset:0;background:rgba(40,25,15,.72);z-index:30;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
.sheet{background:var(--bg);border-radius:22px;padding:16px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px;margin:auto}
.sheet img{width:100%;border-radius:14px;border:2px solid var(--line);display:block}
footer{font-size:13px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden></div>

<script>
(function(){
  /* Address of the family's Google Apps Script web app. Empty = nothing is saved. */
  var API="https://script.google.com/macros/s/AKfycbzYm8OA0TcajSONx7CieKXEvprMX99fBjXwWUb31cqtsGCZr73TtijVvzyjpD6lAIuwBA/exec";

  var SLOTS=[
    {id:"pagi", nm:"Pagi", zh:"早上",emoji:"🌅",hrs:"05:00–10:59"},
    {id:"siang",nm:"Siang",zh:"中午",emoji:"☀️",hrs:"11:00–13:59"},
    {id:"sore", nm:"Sore", zh:"下午",emoji:"🌤️",hrs:"14:00–17:59"},
    {id:"malam",nm:"Malam",zh:"晚上",emoji:"🌙",hrs:"18:00–"}
  ];
  var DEFAULT_CFG={
    meds:[{id:"am",label:"早上的藥",time:"08:00"},{id:"noon",label:"中午飯前的藥",time:"11:30"},{id:"pm",label:"晚上的藥",time:"19:00"}],
    sups:[],
    reminders:[{text:"飯後陪走動十分鐘",slot:"siang"}],
    rehabDays:[1,3,5],
    contacts:[
      {name:"大姐 許瓊瑛",rel:"大女兒",where:"在台中",tip:""},
      {name:"二姐 許芝蘭",rel:"二女兒",where:"在台北，常出差到美國、日本",tip:""},
      {name:"曉雯姐姐 許曉雯",rel:"三女兒",where:"在高雄，離媽媽最近，有狀況請先找她",tip:"如果用 LINE 找不到人，記得打手機",first:true}
    ]
  };
  /* Indonesian for the default Chinese labels the family may keep in settings */
  var KNOWN={"早上的藥":"Obat pagi","中午飯前的藥":"Obat sebelum makan siang","晚上的藥":"Obat malam","飯後陪走動十分鐘":"Temani Ibu jalan 10 menit setelah makan","量血壓":"Ukur tekanan darah",
    "在台中":"Di Taichung","在台北，常出差到美國、日本":"Di Taipei, sering dinas ke Amerika dan Jepang","在高雄，離媽媽最近，有狀況請先找她":"Di Kaohsiung, paling dekat dengan Ibu. Kalau ada masalah, hubungi dia dulu","如果用 LINE 找不到人，記得打手機":"Kalau lewat LINE tidak dijawab, telepon ke nomor HP"};
  var WD=["日","一","二","三","四","五","六"], HARI=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"], BLN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  var MOOD={"好":["Senang dan tenang","開心穩定"],"普通":["Biasa","普通"],"不安":["Gelisah","煩躁不安"],"混亂":["Agak bingung","比較糊塗"]};
  var SLEEP={"好":["Tidur nyenyak","睡得好"],"醒":["Terbangun tengah malam","半夜醒來"],"差":["Susah tidur","睡不好"]};
  var SKIN={ok:["Normal","正常"],bruise:["Ada memar","有瘀青"],red:["Merah bengkak / luka","紅腫或破皮"]};

  var state={date:todayStr(),days:{},cfg:clone(DEFAULT_CFG),who:"看護",sugs:[],chgs:[],view:"home",photos:{}};
  var $=function(id){return document.getElementById(id)};
  function clone(o){return JSON.parse(JSON.stringify(o))}
  function pad(n){return (n<10?"0":"")+n}
  function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function nowHM(){var d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}
  function shift(s,n){var p=s.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function dow(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]).getDay()}
  function labelZh(s){var p=s.split("-");return (+p[1])+"/"+(+p[2])+"（"+WD[dow(s)]+"）"}
  function labelId(s){var p=s.split("-");return HARI[dow(s)]+", "+(+p[2])+" "+BLN[+p[1]-1]}
  function day(){return state.days[state.date]||{date:state.date}}
  function slotOfTime(t){var h=parseInt((t||"").split(":")[0],10),m=parseInt((t||"").split(":")[1],10)||0;if(isNaN(h))return "pagi";var v=h*60+m;return v<630?"pagi":v<840?"siang":v<1080?"sore":"malam"}
  function slotNow(){var h=new Date().getHours();return h<11?"pagi":h<14?"siang":h<18?"sore":"malam"}
  function slotById(id){return SLOTS.filter(function(s){return s.id===id})[0]}

  /* tiny DOM helpers; bi() = Indonesian main line + small Chinese line */
  function el(tag,a,kids){var e=document.createElement(tag);if(a)for(var k in a){if(k==="text")e.textContent=a[k];else if(k==="cls")e.className=a[k];else if(k==="on"){for(var ev in a.on)e.addEventListener(ev,a.on[ev])}else e.setAttribute(k,a[k])}
    (kids||[]).forEach(function(c){if(c==null)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c)});return e}
  function bi(id,zh){return el("span",{cls:"i18n"},[id,el("small",{cls:"zh",text:zh})])}
  function biK(zh){return KNOWN[zh]?bi(KNOWN[zh],zh):el("span",{text:zh})}
  function toast(id,zh){var t=$("toast");t.textContent="";t.appendChild(zh?bi(id,zh):document.createTextNode(id));t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true},2400)}

  try{var w=localStorage.getItem("care-who");if(w)state.who=w}catch(e){}

  /* ---- photos stay on this phone only (never uploaded): kept for today so the card can be made later ---- */
  function photoKey(){return "care-photos-"+state.date}
  function loadPhotos(){try{state.photos=JSON.parse(localStorage.getItem(photoKey())||"{}")||{}}catch(e){state.photos={}}}
  function storePhotos(){try{localStorage.setItem(photoKey(),JSON.stringify(state.photos))}catch(e){toast("Memori foto penuh. Buat kartu sekarang sebelum menutup halaman.","照片空間滿了，請先做圖卡再關掉頁面")}}
  function purgePhotos(){try{var keep={};keep["care-photos-"+todayStr()]=1;keep["care-photos-"+shift(todayStr(),-1)]=1;
    for(var i=localStorage.length-1;i>=0;i--){var k=localStorage.key(i);if(k&&k.indexOf("care-photos-")===0&&!keep[k])localStorage.removeItem(k)}}catch(e){}}
  purgePhotos();loadPhotos();
  function shrink(file,cb){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){var max=1100,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);cb(c.toDataURL("image/jpeg",0.78))};
    img.onerror=function(){URL.revokeObjectURL(url);toast("Foto tidak bisa dibaca","照片讀不到")};
    img.src=url;
  }

  /* ---- shared store: one Google Sheet behind an Apps Script web app ---- */
  var pending=0,lastSnap="",offline=false;
  function post(body){
    if(!API)return;
    pending++;
    fetch(API,{method:"POST",body:JSON.stringify(body)})
      .then(function(r){return r.json()}).then(function(j){if(!j||!j.ok)throw new Error("save")})
      .catch(function(){toast("Gagal tersimpan, coba sekali lagi","沒有存成功，請再按一次")})
      .then(function(){pending--;if(pending===0)setTimeout(load,1500)});
  }
  function typing(){var a=document.activeElement;return !!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"))}
  function load(){
    if(!API){offline=true;return}
    if(pending>0)return;
    fetch(API+"?action=all&t="+Date.now()).then(function(r){return r.json()}).then(function(j){
      var was=offline;offline=false;
      if(pending>0||!j||!j.ok)return;
      var snap=JSON.stringify(j);
      if(snap===lastSnap){if(was&&!typing())render();return}
      lastSnap=snap;
      state.days=j.days||{};state.sugs=j.sugs||[];state.chgs=j.chgs||[];
      if(j.cfg)state.cfg=normCfg(j.cfg);
      if(!typing()&&$("modal").hidden&&!settingsOpen())render();
    }).catch(function(){if(!offline){offline=true;if(!typing())render()}});
  }
  function normCfg(c){
    return {meds:c.meds||clone(DEFAULT_CFG.meds),sups:c.sups||[],
      reminders:(c.reminders||[]).map(function(r){return typeof r==="string"?{text:r,slot:"sore"}:r}).filter(function(r){return r&&r.text&&r.text!=="量血壓"}),
      rehabDays:c.rehabDays||[1,3,5],contacts:c.contacts||clone(DEFAULT_CFG.contacts)};
  }
  function save(patch,quiet){
    state.days[state.date]=Object.assign({},day(),patch,{date:state.date});
    if(!quiet)render();
    post({action:"saveDay",date:state.date,patch:patch,summary:summary()});
  }
  function bpFlag(r){if(r.sys>=140||r.dia>=90)return["alert","Tinggi","偏高"];if(r.sys<90)return["warn","Rendah","偏低"];return["ok","Normal","正常"]}
  function isRehabDay(){return (state.cfg.rehabDays||[]).indexOf(dow(state.date))>=0}

  /* ---- what belongs to each part of the day ---- */
  function slotMeds(id){var d=day();return state.cfg.meds.filter(function(m){return slotOfTime(m.time)===id}).map(function(m){return{m:m,field:"meds",rec:(d.meds||{})[m.id]||{}}})
    .concat(state.cfg.sups.filter(function(m){return slotOfTime(m.time)===id}).map(function(m){return{m:m,field:"sups",rec:(d.sups||{})[m.id]||{}}}))}
  function slotRems(id){var d=day(),rd=d.remDone||{};
    return state.cfg.reminders.filter(function(r){return r.slot===id}).map(function(r){return{text:r.text,done:!!rd[r.text]}})

  var draft=null;

          state.cfg=draft;draft=null;post({action:"setCfg",cfg:state.cfg});openFolds.setFold=false;render();toast("設定已儲存")}}},["儲存設定"])]);
    var d=fold("setFold",el("span",{text:"⚙️ 設定：藥、營養品、提醒、復健日"}),kids);

  function rerenderSettings(){openFolds.setFold=true;var keepDraft=draft,old=$("setFold");var nw=settingsFold();draft=keepDraft;old.parentNode.replaceChild(nw,old)}

  /* ---- Chinese text summary for the family ---- */
  function summary(){
    var d=day(),cfg=state.cfg,L=[],meds=d.meds||{},sups=d.sups||{},meal=d.meal||{};
    L.push("【媽媽的陪伴日記】"+labelZh(state.date));
    var ml=cfg.meds.map(function(m){var r=meds[m.id];return m.label+(r&&r.done?" ✓"+r.at:" ✗未吃")});if(ml.length)L.push("吃藥："+ml.join("、"));
    var sl=cfg.sups.map(function(m){var r=sups[m.id];return m.label+(r&&r.done?" ✓":" ✗")});if(sl.length)L.push("營養品："+sl.join("、"));
    var bp=d.bp||[];L.push("血壓："+(bp.length?bp.map(function(r){return r.at+" "+r.sys+"/"+r.dia+(r.pulse?" 心跳"+r.pulse:"")+"（"+bpFlag(r)[2]+"）"}).join("；"):"還沒量"));
    var mm=[["早餐","b"],["飯前","pre"],["午餐","l"],["晚餐","d"]].filter(function(x){return meal[x[1]]}).map(function(x){return x[0]+"："+meal[x[1]]});if(mm.length)L.push(mm.join("｜"));

    L.push("排便："+(d.bowel==="yes"?"有"+(d.bowelNote?"（"+d.bowelNote+"）":""):d.bowel==="no"?"沒有":"還沒記"));

    if(bd.length)L.push("身體："+bd.join("、"));

  /* lines shown on one slot's picture card (Chinese, for the sisters) */
  function cardLines(id){
    var d=day(),meal=d.meal||{},L=[];
    function medsL(){slotMeds(id).forEach(function(x){L.push([x.rec.done?"✓":"✗",x.m.label+(x.rec.done?"　"+x.rec.at+" 吃了":"　還沒吃")])})}

      (d.bp||[]).forEach(function(r){L.push(["•","血壓 "+r.sys+"/"+r.dia+(r.pulse?"　心跳 "+r.pulse:"")+"（"+bpFlag(r)[2]+"）"])});
      if(isRehabDay()&&d.rehab)L.push([d.rehab==="yes"?"✓":"✗","復健："+(d.rehab==="yes"?"有去":"沒去")])}

      if(d.mood)L.push(["•","心情："+MOOD[d.mood][1]]);L.push(["•","喝水 "+(d.cups||0)+" 杯"])}
    if(id==="malam"){if(meal.d)L.push(["•","晚餐："+meal.d]);medsL();L.push(["•","今天喝水 "+(d.cups||0)+" 杯"]);
      if(d.fall)L.push([d.fall==="yes"?"⚠":"✓",d.fall==="yes"?"今天有跌倒／撞到":"今天沒有跌倒"]);if(d.skin)L.push(["•","皮膚："+SKIN[d.skin][1]+(d.skinNote?"（"+d.skinNote+"）":"")]);
      if(d.temp)L.push(["•","體溫 "+d.temp]);if(d.weight)L.push(["•","體重 "+d.weight+" 公斤"])}

  /* ---- picture card ---- */
  var CARD_COL={pagi:["#FFE6D3","#A4531E"],siang:["#FFF0C7","#8A6410"],sore:["#DDF2E6","#2E7A55"],malam:["#E6E1FA","#5140A0"]};
  function wrapText(ctx,text,maxW){var out=[];String(text).split("\n").forEach(function(par){var line="";for(var i=0;i<par.length;i++){var ch=par[i];
      if(ctx.measureText(line+ch).width>maxW&&line){var cut=line.lastIndexOf(" ");if(cut>line.length*0.5&&ch!==" "){out.push(line.slice(0,cut));line=line.slice(cut+1)+ch}else{out.push(line);line=ch===" "?"":ch}}else line+=ch}
      out.push(line)});return out}
  function loadImg(src){return new Promise(function(res){var i=new Image();i.onload=function(){res(i)};i.onerror=function(){res(null)};i.src=src})}
  function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
  function cover(ctx,img,x,y,w,h,r){ctx.save();rr(ctx,x,y,w,h,r);ctx.clip();var s=Math.max(w/img.width,h/img.height),dw=img.width*s,dh=img.height*s;ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);ctx.restore()}
  function drawCard(slot){
    var W=1080,P=48,col=CARD_COL[slot.id],lines=cardLines(slot.id),notes=slotNotes(slot.id),srcs=state.photos[slot.id]||[];
    var FB='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif',FD='"LXGW WenKai TC",'+FB;
    return Promise.all(srcs.map(loadImg)).then(function(imgs){
      imgs=imgs.filter(Boolean);
      var m=document.createElement("canvas").getContext("2d");
      m.font="500 40px "+FB;var body=[];lines.forEach(function(l){wrapText(m,l[1],W-P*2-150).forEach(function(t,i){body.push([i===0?l[0]:"",t])})});
      m.font="400 40px "+FD;var nl=[];notes.forEach(function(n){wrapText(m,"「"+n.text+"」",W-P*2-80).forEach(function(t){nl.push(t)});nl.push("")});if(nl.length)nl.pop();
      var photoH=imgs.length===0?0:imgs.length===1?740:imgs.length===2?480:(740+16+316);
      var H=P/2+150+30+(photoH?photoH+36:0)+(body.length?body.length*62+40+32:0)+(nl.length?nl.length*58+52+32:0)+90;
      var c=document.createElement("canvas");c.width=W;c.height=H;var ctx=c.getContext("2d");
      ctx.fillStyle="#FFF6EC";ctx.fillRect(0,0,W,H);
      ctx.fillStyle=col[0];rr(ctx,P/2,P/2,W-P,150,36);ctx.fill();
      ctx.fillStyle=col[1];ctx.textBaseline="middle";ctx.font="700 64px "+FD;ctx.fillText(slot.zh+"・媽媽的陪伴日記",P+14,P/2+54);
      ctx.fillStyle="#6B5E57";ctx.font="500 34px "+FB;ctx.fillText(labelZh(state.date)+"　"+nowHM()+"　記錄："+state.who,P+16,P/2+114);
      var y=P/2+150+30,G=16,fullW=W-P*2,hw=(fullW-G)/2;
      if(imgs.length===1){cover(ctx,imgs[0],P,y,fullW,740,28)}
      else if(imgs.length===2){cover(ctx,imgs[0],P,y,hw,480,28);cover(ctx,imgs[1],P+hw+G,y,hw,480,28)}
      else if(imgs.length>=3){cover(ctx,imgs[0],P,y,fullW,740,28);cover(ctx,imgs[1],P,y+740+G,hw,316,28);cover(ctx,imgs[2],P+hw+G,y+740+G,hw,316,28)}
      if(photoH)y+=photoH+36;
      if(body.length){
        ctx.fillStyle="#FFFFFF";rr(ctx,P,y,fullW,body.length*62+40,28);ctx.fill();
        var ty=y+20+31;body.forEach(function(b){ctx.font="700 40px "+FB;ctx.fillStyle=b[0]==="✗"||b[0]==="⚠"?"#B2362C":b[0]==="✓"?"#2E7A55":"#A89A90";if(b[0])ctx.fillText(b[0],P+32,ty);ctx.font="500 40px "+FB;ctx.fillStyle="#2A2320";ctx.fillText(b[1],P+96,ty);ty+=62});
        y+=body.length*62+40+32;
      }
      if(nl.length){
        ctx.fillStyle=col[0];rr(ctx,P,y,fullW,nl.length*58+52,28);ctx.fill();
        var ny=y+26+29;ctx.fillStyle="#2A2320";ctx.font="400 40px "+FD;nl.forEach(function(t){ctx.fillText(t,P+36,ny);ny+=58});
        y+=nl.length*58+52+32;
      }
      ctx.fillStyle="#9A8B82";ctx.font="400 28px "+FB;ctx.textAlign="center";ctx.fillText("媽媽的陪伴日記",W/2,H-48);ctx.textAlign="left";
      return c;
    });
  }
  function makeCard(slot){
    toast("Sedang membuat kartu…","圖卡製作中…");
    var fontsReady=(document.fonts&&document.fonts.load)?Promise.all([document.fonts.load('700 64px "LXGW WenKai TC"',"媽媽的陪伴日記"),document.fonts.load('500 40px "Noto Sans TC"',"媽媽")]).catch(function(){}):Promise.resolve();
    fontsReady.then(function(){return drawCard(slot)}).then(function(c){

          el("a",{cls:"ghost",href:url,download:name,style:"text-align:center;text-decoration:none;display:block"},[bi("Simpan gambar","存成圖片")]),
          el("p",{cls:"muted"},[bi("Atau tekan lama gambar di atas → Bagikan / Simpan, lalu kirim ke grup LINE.","也可以長按上面的圖 → 分享或儲存，再貼到 LINE 群組")]),
